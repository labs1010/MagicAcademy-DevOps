name: Python quality and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: ci_ephemeral_password_only
          POSTGRES_DB: magic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy -d magic_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://academy:ci_ephemeral_password_only@localhost:5432/magic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --junitxml=results/pytest.xml
      - name: Validate Compose model
        run: |
          python scripts/configure.py
          docker compose config --quiet
      - name: Build and check persistence
        run: python scripts/verify_docker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: results/
