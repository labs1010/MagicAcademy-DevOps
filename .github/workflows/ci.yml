name: MagicAcademy CI
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: magic_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U academy -d magic_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://academy:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/magic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m compileall -q app
      - name: Lint
        run: |
          python -m ruff check . --exclude planner --output-format github
          python -m ruff format --check . --exclude planner
      - name: Test
        run: python -m pytest tests -q --junitxml=results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests
          path: results/pytest.xml

  planner:
    name: Planner checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: planner/requirements*.txt
      - name: Build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m compileall -q main.py
      - name: Lint
        run: |
          python -m ruff check . --output-format github
          python -m ruff format --check .
      - name: Test
        run: python -m pytest -q test_planner.py

  docker:
    name: Docker build
    needs: [api, planner]
    env:
      API_IMAGE: lab-api
      PLANNER_IMAGE: lab-planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build images
        run: |
          python scripts/configure.py
          docker compose config --quiet
          docker compose build
      - name: Verify Compose health and persistence
        run: |
          python -m pip install httpx==0.28.1
          python scripts/verify_docker.py --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-verification
          path: results/docker_verification.json
      - name: Export verified build for publication
        if: github.event_name == 'push'
        run: docker save -o images.tar lab-api lab-planner
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: container-images
          path: images.tar
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: docker
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
      - run: docker load -i images.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for service in api planner; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$service"
            docker tag "lab-$service" "$image:$GITHUB_SHA"
            docker push "$image:$GITHUB_SHA"
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              docker tag "lab-$service" "$image:latest"
              docker push "$image:latest"
            fi
          done
